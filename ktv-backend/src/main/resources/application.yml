server:
  port: 8080

spring:
  application:
    name: ktv-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ktv_db?useUnicode=true&characterEncoding=utf8&useSSL=${DB_USE_SSL:false}&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY:true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Qq123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 5000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: 3000ms
          max-idle: 8
          min-idle: 2
        shutdown-timeout: 200ms
        cluster:
          refresh:
            adaptive: true
            period: 30s
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

media:
  base-path: ${MEDIA_BASE_PATH:/data/ktv-media}

ktv:
  security:
    magic-check-enabled: ${MAGIC_CHECK_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 7200000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    com.ktv: ${LOG_LEVEL_APP:debug}
    org.springframework.web: ${LOG_LEVEL_WEB:info}
    org.springframework.data: ${LOG_LEVEL_DATA:warn}
    org.mybatis: ${LOG_LEVEL_MYBATIS:warn}
  file:
    name: logs/ktv-backend.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

---
spring:
  config:
    activate:
      on-profile: prod
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: true

logging:
  level:
    com.ktv: info
    org.springframework.web: warn
    org.springframework.data: warn
    org.mybatis: warn

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
